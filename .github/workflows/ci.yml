name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Set time zone
        shell: powershell
        # Some conversion tests assert local-time strings and assume CET, so
        # they fail on the UTC runners. release.yml sets the same zone.
        run: Set-TimeZone -Id 'W. Europe Standard Time'

      - uses: actions/checkout@v5
        with:
          # GitVersion needs the full history to determine the next version
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.x'

      - name: Put GitVersion on PATH
        shell: powershell
        # The setup action exposes GITVERSION_PATH but does not add it to
        # PATH, and installs the tool as dotnet-gitversion.exe. The
        # GetNextVersion build task shells out to bare 'gitversion', so expose
        # it under that name via a shim rather than teaching the build script
        # about a second spelling.
        run: |
          $exe = Get-ChildItem -Path $env:GITVERSION_PATH -Filter '*gitversion*.exe' -Recurse |
              Select-Object -First 1
          if (-not $exe) { throw "No gitversion executable found under $env:GITVERSION_PATH" }

          $shim = Join-Path $env:RUNNER_TEMP 'gitversion-shim'
          New-Item -ItemType Directory -Path $shim -Force | Out-Null
          if ($exe.Name -eq 'gitversion.exe') {
              $dir = $exe.Directory.FullName
          }
          else {
              Set-Content -Path (Join-Path $shim 'gitversion.cmd') `
                  -Value "@echo off`r`n`"$($exe.FullName)`" %*" -Encoding ascii
              $dir = $shim
          }
          $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify GitVersion is callable
        shell: powershell
        # Same invocation the GetNextVersion task uses, so this fails here
        # with a clear message rather than deep inside the build.
        run: (gitversion | ConvertFrom-Json).MajorMinorPatch

      - name: Resolve dependencies
        shell: powershell
        run: |
          Install-Module PSDepend -Force -Scope CurrentUser
          Invoke-PSDepend -Path .\PowerLFM.depend.psd1 -Force
          # PSDepend installs to build\modules and only puts it on
          # PSModulePath for its own session; each step is a fresh shell,
          # so persist it or Invoke-Build is not found in later steps.
          "PSModulePath=$env:GITHUB_WORKSPACE\build\modules;$env:PSModulePath" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Analyze
        shell: powershell
        run: .\build.ps1 -Task Analyze

      - name: Build
        shell: powershell
        run: .\build.ps1 -Task Build

      - name: Test
        shell: powershell
        run: .\build.ps1 -Task Test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: |
            build/testResults.xml
            build/codecoverage.xml

  # The Scrobble Queue is a file, a directory and an exclusive handle, which is the part
  # of this module that behaves differently per operating system: FileShare is mandatory
  # on Windows and advisory on Unix, and the queue path resolves through a different
  # variable on each. The job above proves none of that, because it only ever runs
  # Windows PowerShell on Windows.
  #
  # Deliberately narrow. It builds and runs the scrobble queue tests, and nothing else:
  # no GitVersion, no coverage, no publishing path. The Windows job stays the one that
  # has to pass for everything.
  scrobble-queue-linux:
    name: Scrobble queue on Linux
    runs-on: ubuntu-latest

    env:
      # Some conversion tests assert local-time strings and assume CET. The Windows job
      # sets the zone with Set-TimeZone, which does not exist here; TZ is what .NET reads
      # on Linux.
      TZ: Europe/Berlin

    steps:
      - uses: actions/checkout@v5

      - name: Resolve dependencies
        shell: pwsh
        run: |
          Install-Module PSDepend -Force -Scope CurrentUser
          Invoke-PSDepend -Path ./PowerLFM.depend.psd1 -Force
          # Each step is a fresh shell, and the separator is not the one Windows uses.
          "PSModulePath=$env:GITHUB_WORKSPACE/build/modules:$env:PSModulePath" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build
        shell: pwsh
        # Built directly rather than through the Build task, which derives a version from
        # GitVersion. The version is not what this job is testing.
        run: |
          Import-Module ModuleBuilder
          Build-Module -Path ./source/build.psd1 -Version '0.0.0'

      - name: Test
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 6.0.0 -Force

          # The manifest, the way a user loads it, rather than the root module behind
          # it: importing it here is what proves the module is importable off Windows.
          $manifest = Get-Item ./build/PowerLFM/*/PowerLFM.psd1
          Import-Module $manifest -Force -Global

          # Every test file that names a scrobble: the queue, its lock, the identity, the
          # migrations, and the commands that read and write it.
          $paths = Get-ChildItem -Path ./source/tests -Recurse -Filter '*.ps1' |
              Where-Object { $_.Name -like '*Scrobble*' }
          if (-not $paths) { throw 'Found no scrobble queue tests to run' }

          $configuration = New-PesterConfiguration
          $configuration.Run.Path = $paths.FullName
          $configuration.Run.Passthru = $true
          $configuration.Filter.Tag = 'Unit', 'Integration', 'Concurrency'
          $configuration.TestResult.Enabled = $true
          $configuration.TestResult.OutputPath = './build/testResults-linux.xml'
          $configuration.Output.Verbosity = 'Detailed'

          $testResults = Invoke-Pester -Configuration $configuration
          if ($testResults.FailedCount -gt 0) {
              throw "$($testResults.FailedCount) test(s) failed"
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-linux
          path: build/testResults-linux.xml
