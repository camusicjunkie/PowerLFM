name: Release

# Publishing used to hang off AppVeyor's on_success hook, which fired on every
# main build and then decided for itself whether the newest tag matched the
# built version. Tag pushes are the actual trigger, so key the workflow on them
# directly and keep only the guard that catches a tag disagreeing with the
# version GitVersion derives.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Set time zone
        shell: powershell
        # The Test task runs here too, and some conversion tests assert
        # local-time strings that assume CET. Match ci.yml.
        run: Set-TimeZone -Id 'W. Europe Standard Time'

      - uses: actions/checkout@v5
        with:
          # GitVersion needs the full history to determine the version
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.x'

      - name: Put GitVersion on PATH
        shell: powershell
        # The setup action exposes GITVERSION_PATH but does not add it to PATH,
        # and installs the tool as dotnet-gitversion.exe. The GetNextVersion
        # build task shells out to bare 'gitversion', so expose it under that
        # name via a shim.
        run: |
          $exe = Get-ChildItem -Path $env:GITVERSION_PATH -Filter '*gitversion*.exe' -Recurse |
              Select-Object -First 1
          if (-not $exe) { throw "No gitversion executable found under $env:GITVERSION_PATH" }

          $shim = Join-Path $env:RUNNER_TEMP 'gitversion-shim'
          New-Item -ItemType Directory -Path $shim -Force | Out-Null
          if ($exe.Name -eq 'gitversion.exe') {
              $dir = $exe.Directory.FullName
          }
          else {
              Set-Content -Path (Join-Path $shim 'gitversion.cmd') `
                  -Value "@echo off`r`n`"$($exe.FullName)`" %*" -Encoding ascii
              $dir = $shim
          }
          $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Resolve dependencies
        shell: powershell
        run: |
          Install-Module PSDepend -Force -Scope CurrentUser
          Invoke-PSDepend -Path .\PowerLFM.depend.psd1 -Force
          # PSDepend installs to build\modules and only puts it on PSModulePath
          # for its own session; each step is a fresh shell, so persist it or
          # Invoke-Build is not found in later steps.
          "PSModulePath=$env:GITHUB_WORKSPACE\build\modules;$env:PSModulePath" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build
        shell: powershell
        run: .\build.ps1 -Task Build

      - name: Test
        shell: powershell
        run: .\build.ps1 -Task Test

      - name: Verify the tag matches the built version
        shell: powershell
        run: |
          $tagVersion = '${{ github.ref_name }}' -replace '^v' -as [Version]
          if (-not $tagVersion) { throw "Tag '${{ github.ref_name }}' is not a version" }

          $manifest = Get-Item -Path "$env:GITHUB_WORKSPACE\build\*\*\*.psd1" |
              Where-Object { $_.BaseName -eq $_.Directory.Parent.Name }
          $buildVersion = (Import-PowerShellDataFile -Path $manifest.FullName)['ModuleVersion'] -as [Version]

          if ($tagVersion -ne $buildVersion) {
              throw "Tag $tagVersion does not match build version $buildVersion"
          }

      - name: Publish to the PowerShell Gallery
        shell: powershell
        env:
          NuGetApiKey: ${{ secrets.NUGET_API_KEY }}
        # The PublishToPSGallery task reads $env:NuGetApiKey when the parameter
        # is not passed, so the key never lands in the command line or logs.
        run: .\build.ps1 -Task Publish
